# The quickstart with sqlx 0.9, whose `sqlite` feature compiles its bundled
# SQLite unless libsqlite3-sys is PotluckDB's. sqlx 0.9 needs libsqlite3-sys
# 0.37, so this app is its own workspace, patched to rust/libsqlite3-sys/0.37.
[package]
name = "quickstart-sqlx"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.53.2", features = ["macros", "rt"] }
potluckdb = { path = "../../potluckdb" }

[patch.crates-io]
libsqlite3-sys = { path = "../../libsqlite3-sys/0.37" }

[workspace]

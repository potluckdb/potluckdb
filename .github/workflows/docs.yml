# Publishes the docs site (docs/) of a release to https://docs.potluckdb.com
# (PRD E5): builds docs/ from the release's tag as ci.yml does, with the
# release's version filled in, then deploys it as the production site of
# the Cloudflare Pages project potluckdb-docs.
# release.yml starts it for each release while the repository variable
# DOCS_PUBLISHING is true; started by hand, it puts back an earlier release's
# docs.
#
# The build runs the tag's code without the Cloudflare token; the deploy job
# runs only this file and wrangler, on the built files. wrangler and every
# package it loads come from .github/docs-deploy/package-lock.json of this
# workflow's own commit, with their hashes, installed before the token is
# given. The site gets a release.txt (version, commit, run), which the last
# step looks for at docs.potluckdb.com.
name: docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of a published release, e.g. 0.8.0-dev.3 (or its tag, v0.8.0-dev.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION=${VERSION#v}
          id='[0-9A-Za-z-]+'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-$id(\.$id)*)?(\+$id(\.$id)*)?$ ]]; then
            echo "::error::The version is not a release version such as 0.8.0-dev.3."
            exit 1
          fi
          if [ "$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null)" != false ]; then
            echo "::error::$GITHUB_REPOSITORY has no published release v$VERSION."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null; then
            echo "::error::$GITHUB_REPOSITORY has no tag v$VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ steps.release.outputs.version }}
          persist-credentials: false
      - name: The tag's commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: docs
      - name: Fill in the version
        # The pages write {{VERSION}} where they name a release (ci.yml
        # rejects a fixed one), so each release's docs name that release.
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: grep -rlF '{{VERSION}}' docs/src/content | xargs -r sed -i "s/{{VERSION}}/$VERSION/g"
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/dist/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: docs
      url: https://docs.potluckdb.com
    env:
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      # wrangler from this workflow's commit, not the tag's; into tool/, so
      # that the working directory holds no wrangler config or functions/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: .github/docs-deploy
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install wrangler
        # A static deploy needs no package's install script.
        working-directory: tool/.github/docs-deploy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      - name: Static files only
        # wrangler would bundle a _worker.js, while it holds the token.
        run: |
          if [ -e site/_worker.js ]; then
            echo "::error::The build has a _worker.js; the docs site is static files only."
            exit 1
          fi
      - name: Mark the deployment
        # The last step looks for this file at docs.potluckdb.com.
        run: |
          {
            echo "PotluckDB $VERSION"
            echo "commit $COMMIT"
            echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          } > site/release.txt
          cat site/release.txt
      - name: Deploy to Cloudflare Pages
        # main is the project's production branch: a deployment to it is
        # what docs.potluckdb.com serves.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          tool/.github/docs-deploy/node_modules/.bin/wrangler pages deploy site \
            --project-name potluckdb-docs --branch main \
            --commit-hash "$COMMIT" --commit-message "PotluckDB $VERSION"
      - name: docs.potluckdb.com serves it
        run: |
          deadline=$((SECONDS + 120))
          while :; do
            if curl -sSf --connect-timeout 5 --max-time 10 \
                "https://docs.potluckdb.com/release.txt?run=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" | cmp -s - site/release.txt; then
              echo "https://docs.potluckdb.com serves the docs of PotluckDB $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$SECONDS" -lt "$deadline" ] || break
            sleep 10
          done
          echo "::error::Deployed, but docs.potluckdb.com/release.txt is not this deployment's after 2 minutes."
          exit 1

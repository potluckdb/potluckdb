# The Python package (python/): wheels of potluckdb for CPython 3.10-3.14,
# each linking a PotluckDB core release, tested with the package's own tests
# and CPython's sqlite3 test suite.
#
#   pull request / push touching python/   tooling tests, plus Linux x64 wheels
#                                          for Python 3.10 and 3.14
#   nightly, or run by hand                all 8 platforms x 5 Python versions
#   run by hand or called with publish     the same, then upload to PyPI
#
# Wheels need the core release (python/CORE_VERSION, or the version input) on
# https://github.com/potluckdb/potluckdb/releases. Until it exists, the wheel
# jobs are skipped with a notice instead of failing.
name: python

on:
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "PotluckDB core release to build against, e.g. 0.8.0-dev.1 (default: python/CORE_VERSION)"
        required: false
      publish:
        description: "Upload the wheels to PyPI"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "PotluckDB core release to build against, e.g. 0.8.0-dev.1"
        type: string
        required: true
      publish:
        description: "Upload the wheels to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}-${{ github.event_name }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test tooling
        run: python3 python/tests/test_tooling.py -v

  core:
    # Which core release to build against, and whether it is out yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          version="${INPUT_VERSION:-$(cat python/CORE_VERSION)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if python3 python/core_archive.py release-exists --version "$version"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = true ]; then
            echo "::error title=No PotluckDB release::PotluckDB core $version is not released (https://github.com/potluckdb/potluckdb/releases/tag/v$version), so there is nothing to publish."
            exit 1
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Python wheels skipped::PotluckDB core $version is not released yet (https://github.com/potluckdb/potluckdb/releases/tag/v$version). The wheels are built and tested once it is."
          fi

  quick:
    # Every change under python/: Linux x64 with the oldest and newest Python.
    # setup-python's CPython uses the system's libsqlite3, so the isolation
    # tests also cover "another SQLite is already loaded in the process".
    needs: core
    if: needs.core.outputs.released == 'true' && !inputs.version && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      POTLUCKDB_CORE_VERSION: ${{ needs.core.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist python
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Package tests (quickstart, names, isolation, symbols)
        run: python python/tests/test_package.py -v
        env:
          POTLUCKDB_EXPECT_CORE_VERSION: ${{ needs.core.outputs.version }}
      - name: CPython's sqlite3 test suite
        run: python python/tests/run_cpython_tests.py

  wheels:
    # Nightly, by hand and for releases: every platform the library is built for.
    needs: core
    # (In a called workflow, event_name is the caller's; the version input is set.)
    if: needs.core.outputs.released == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.version)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64-gnu, skip: "*-musllinux_*" }
          - { os: ubuntu-24.04, target: linux-x64-musl, skip: "*-manylinux_*" }
          - { os: ubuntu-24.04-arm, target: linux-arm64-gnu, skip: "*-musllinux_*" }
          - { os: ubuntu-24.04-arm, target: linux-arm64-musl, skip: "*-manylinux_*" }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-2025, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        with:
          package-dir: python
          output-dir: wheelhouse
        env:
          POTLUCKDB_CORE_VERSION: ${{ needs.core.outputs.version }}
          POTLUCKDB_EXPECT_CORE_VERSION: ${{ needs.core.outputs.version }}
          CIBW_SKIP: ${{ matrix.skip || '' }}
      - name: Check the wheels
        shell: bash
        run: |
          ls -l wheelhouse
          test "$(ls wheelhouse/*.whl | wc -l)" -ge 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    # Upload with PyPI trusted publishing. PyPI must trust workflow python.yml
    # of potluckdb/potluckdb, environment "pypi". PyPI does not accept a
    # reusable (called) workflow as the publisher (pypi/warehouse#11096), so
    # publish by running this workflow by hand; a workflow that calls it
    # must build only (publish: false) or be registered on PyPI itself.
    needs: [core, wheels]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/potluckdb/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Check the wheels are for one version
        env:
          CORE_VERSION: ${{ needs.core.outputs.version }}
        run: |
          ls -l dist
          versions=$(ls dist/*.whl | sed -E 's|dist/potluckdb-([^-]+)-.*|\1|' | sort -u)
          echo "versions: $versions"
          test "$(echo "$versions" | wc -l)" -eq 1
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

# Publishes a release that core's release-build workflow prepared as a draft
# (PRD E5): checks the exact files and their signatures, tests them on every
# platform, builds and tests every package from them, then writes the release
# notes, publishes the GitHub release and starts each package's publishing.
# Nothing is published unless every check passed. Nothing is rebuilt.
# Started by core's release-build workflow.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the draft release, e.g. 0.8.0-dev.1"
        required: true
      dry_run:
        description: "Run every check, publish nothing (stop before finalize)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # read the draft release
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D dist
      - name: Checksums and signatures
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/potluckdb/core/.github/workflows/release-build.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f" > /dev/null
          done
          echo "ok: every file matches SHA256SUMS and core's release signature"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs in the oldest systems the builds support.
          - { os: ubuntu-24.04, target: linux-x64-gnu, image: "almalinux:8" }
          - { os: ubuntu-24.04-arm, target: linux-arm64-gnu, image: "almalinux:8" }
          - { os: ubuntu-24.04, target: linux-x64-musl, image: "alpine:3.22" }
          - { os: ubuntu-24.04-arm, target: linux-arm64-musl, image: "alpine:3.22" }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-2025, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Run a query (${{ matrix.target }})
        if: ${{ !matrix.image }}
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          EXT: ${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
        run: |
          $PYTHON tests/release/smoke.py dist/potluckdb-sqlite-"$VERSION"-${{ matrix.target }}.$EXT "$VERSION"
      - name: Run a query (${{ matrix.target }}, in ${{ matrix.image }})
        if: ${{ matrix.image }}
        run: |
          docker run --rm -e VERSION -v "$PWD:/w" -w /w ${{ matrix.image }} sh -euc '
            # dnf sometimes stalls on a mirror: give each try 5 minutes.
            if command -v apk > /dev/null; then apk add -q python3 > /dev/null; else
              for i in 1 2 3; do timeout 300 dnf -q -y --setopt=timeout=30 install python3 > /dev/null && break
                [ "$i" = 3 ] && exit 1; echo "dnf stalled or failed; trying again"; done; fi
            python3 tests/release/smoke.py dist/potluckdb-sqlite-"$VERSION"-${{ matrix.target }}.tar.gz "$VERSION"'

  # Every package's build and tests on all 8 platforms (publish: false), from
  # the draft's files that verify checked (archives: run), before anything is
  # published. Packages whose publishing is off are checked too. finalize
  # starts the publishing runs on their own, as each registry trusts only its
  # own workflow file.
  # The permissions are those each workflow's publish job asks for, which
  # GitHub requires even though that job is skipped here; every job that runs
  # has the workflow's own permissions (contents: read).
  check-python:
    needs: verify
    uses: ./.github/workflows/python.yml
    permissions: { contents: read, id-token: write }
    with: { version: "${{ inputs.version }}", publish: false, archives: run }
  check-rust:
    needs: verify
    uses: ./.github/workflows/rust.yml
    permissions: { contents: write, id-token: write }
    with: { version: "${{ inputs.version }}", publish: false, archives: run }
  check-dotnet:
    needs: verify
    uses: ./.github/workflows/dotnet.yml
    permissions: { contents: read, id-token: write }
    with: { version: "${{ inputs.version }}", publish: false, archives: run }
  check-node:
    needs: verify
    uses: ./.github/workflows/node.yml
    permissions: { contents: read, id-token: write }
    with: { version: "${{ inputs.version }}", publish: false, archives: run }
  check-go:
    needs: verify
    uses: ./.github/workflows/go.yml
    with: { version: "${{ inputs.version }}", publish: false, archives: run }

  finalize:
    needs: [test, check-python, check-rust, check-dotnet, check-node, check-go]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # release notes, the tag and the release
      actions: write # start the package publishing workflows
    steps:
      - name: Is publishing on for every registry?
        # A release goes out to all of them or to none.
        env:
          PYPI_PUBLISHING: ${{ vars.PYPI_PUBLISHING }}
          CRATES_IO_PUBLISHING: ${{ vars.CRATES_IO_PUBLISHING }}
          NUGET_PUBLISHING: ${{ vars.NUGET_PUBLISHING }}
          NPM_PUBLISHING: ${{ vars.NPM_PUBLISHING }}
          GO_PUBLISHING: ${{ vars.GO_PUBLISHING }}
        run: |
          off=0
          for v in PYPI_PUBLISHING CRATES_IO_PUBLISHING NUGET_PUBLISHING NPM_PUBLISHING GO_PUBLISHING; do
            [ "${!v}" = true ] || { echo "::error::The repository variable $v is not 'true'. Nothing was published."; off=1; }
          done
          exit $off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes, tag and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish only what the checks tested: apart from release notes,
          # main must still be this run's commit.
          tested() {
            git diff --quiet "$GITHUB_SHA" "$1" -- . ':!CHANGELOG.md' ':!changes' && return
            echo "::error::main has changed since this run's checks started, so they did not test it. Nothing was published: start release.yml again for $VERSION."
            exit 1
          }
          git fetch -q origin main
          tested origin/main
          python3 tools/release_notes.py --version "$VERSION" --notes-out ../notes.md
          git add -A CHANGELOG.md changes
          git commit -m "Release notes for $VERSION"
          # main may have moved meanwhile: put the notes on top, if its code
          # is still what was tested.
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
            tested HEAD~1
          done
          kind=$([[ "$VERSION" == *-* ]] && echo --prerelease || echo --latest)
          gh release edit "v$VERSION" --draft=false $kind --tag "v$VERSION" \
            --target "$(git rev-parse HEAD)" --title "PotluckDB $VERSION" --notes-file ../notes.md
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
      - name: Publish the Python package
        if: vars.PYPI_PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run python.yml -R "$GITHUB_REPOSITORY" -f version="$VERSION" -f publish=true
      - name: Publish the Rust crate
        if: vars.CRATES_IO_PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rust.yml -R "$GITHUB_REPOSITORY" -f version="$VERSION" -f publish=true
      - name: Publish the .NET packages
        if: vars.NUGET_PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dotnet.yml -R "$GITHUB_REPOSITORY" -f version="$VERSION" -f publish=true
      - name: Publish the npm packages
        # Each registry trusts its own workflow file, so it runs on its own,
        # from the published release's exact archives. On once npm trusts it.
        if: vars.NPM_PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run node.yml -R "$GITHUB_REPOSITORY" -f version="$VERSION" -f publish=true
      - name: Publish the Go modules
        # go.yml writes the release's modules to potluckdb-go and tags them.
        # On once its deploy key is set up (go/DESIGN.md).
        if: vars.GO_PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run go.yml -R "$GITHUB_REPOSITORY" -f version="$VERSION" -f publish=true
      - name: Publish the docs
        # docs.yml deploys the release's docs/ to docs.potluckdb.com. Runs
        # even if starting a registry workflow above failed: the release is out.
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && vars.DOCS_PUBLISHING == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml -R "$GITHUB_REPOSITORY" -f version="$VERSION"

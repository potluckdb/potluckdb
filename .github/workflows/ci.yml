name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - name: Change notes are valid
        run: python3 tools/release_notes.py --version 0.0.0-check --check

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: No page names a released PotluckDB version
        # docs.yml fills in {{VERSION}} with each release's own version, so no
        # page names an older one. start/status.md lists the versions on
        # purpose. Other projects' versions (SQLite 3.54.1) are not tags here.
        run: |
          released=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||')
          if [ -z "$released" ]; then
            echo "::error::Could not list this repository's release tags."
            exit 1
          fi
          # Each released version and its Python form (0.8.0.dev4), with no digit next to it.
          versions=$(printf '%s\n' "$released" | sed 'p; s/-dev\./.dev/; s/-rc\./rc/; s/-alpha\./a/; s/-beta\./b/' \
            | sort -u | sed 's/[.+]/\\&/g' | paste -sd '|')
          grep -rnE "(^|[^0-9])($versions)(\$|[^0-9])" src/content > "$RUNNER_TEMP/found" || [ $? = 1 ]
          if grep -v '^src/content/docs/start/status.md:' "$RUNNER_TEMP/found"; then
            echo "::error::A docs page names a released PotluckDB version, which goes out of date. Write {{VERSION}}: docs.yml fills in the release's version."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build

# The .NET packages (dotnet/): makes PotluckDB's native library for each
# platform from a PotluckDB release, packs the NuGet packages, tests them, and
# (when asked) publishes them to nuget.org.
#
# - Changes under dotnet/: Linux x64 only.
# - Nightly, by hand, or called from another workflow: all 8 platforms.
# - publish: also push PotluckDB.SQLitePCLRaw and PotluckDB.Data.Sqlite to
#   nuget.org with trusted publishing (OIDC, no stored API key).
#
# The native library is made from a release's core archives, so nothing is
# built before the first release exists; the run then passes with a notice.
name: dotnet

on:
  pull_request:
    paths: ["dotnet/**", ".github/workflows/dotnet.yml"]
  push:
    branches: [main]
    paths: ["dotnet/**", ".github/workflows/dotnet.yml"]
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "PotluckDB version, e.g. 0.8.0-dev.1 (default: the latest release)"
        required: false
      publish:
        description: "Publish the NuGet packages for this version"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "PotluckDB version, e.g. 0.8.0-dev.1"
        type: string
        required: true
      publish:
        description: "Publish the NuGet packages for this version"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}-${{ inputs.version }}-${{ inputs.publish }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # musl: the native library is built on Alpine 3.22 (the image node.yml
  # builds on) and tested in the .NET SDK's Alpine image.
  ALPINE_BUILD_IMAGE: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
  ALPINE_TEST_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0.401-alpine3.23@sha256:3f9c03432d664163a90d20e3ed0a3784d0aa82c1b9cbd1a7dd4609fede95669e
  # The oldest glibc PotluckDB supports (2.28).
  OLDEST_GLIBC_IMAGE: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Find the PotluckDB release to build from
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
            VERSION=${VERSION#v}
          fi
          if [ -n "$VERSION" ] && gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "Building from PotluckDB $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::potluckdb/potluckdb has no release v$VERSION, so there is nothing to publish."
            exit 1
          else
            echo "::notice title=.NET packages not built::potluckdb/potluckdb has no release${VERSION:+ v$VERSION} yet, so there is no PotluckDB library to make the .NET packages from. Their build and tests are skipped and run once the first release (0.8.0-dev.1) is out."
          fi
      - name: Choose the platforms
        id: matrix
        if: steps.release.outputs.version
        env:
          ALL: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}
          # glibc builds run in manylinux_2_28 (the oldest glibc they support),
          # with the images node.yml uses.
          PLATFORMS: >-
            [
              {"target": "linux-x64-gnu", "rid": "linux-x64", "os": "ubuntu-24.04", "container": "manylinux",
               "image": "quay.io/pypa/manylinux_2_28_x86_64@sha256:076b19ef6e698f28649fa817c49d14443201e01da85240e8e52f93e8daa49bff"},
              {"target": "linux-arm64-gnu", "rid": "linux-arm64", "os": "ubuntu-24.04-arm", "container": "manylinux",
               "image": "quay.io/pypa/manylinux_2_28_aarch64@sha256:270a5e59af09f02dfc07fe4bb2cb2c5625c76d085cfa47f87dd93d9026eacc75"},
              {"target": "linux-x64-musl", "rid": "linux-musl-x64", "os": "ubuntu-24.04", "container": "alpine"},
              {"target": "linux-arm64-musl", "rid": "linux-musl-arm64", "os": "ubuntu-24.04-arm", "container": "alpine"},
              {"target": "macos-arm64", "rid": "osx-arm64", "os": "macos-15"},
              {"target": "macos-x64", "rid": "osx-x64", "os": "macos-15-intel"},
              {"target": "windows-x64", "rid": "win-x64", "os": "windows-2025"},
              {"target": "windows-arm64", "rid": "win-arm64", "os": "windows-11-arm"}
            ]
        run: |
          if [ "$ALL" = true ]; then
            echo "matrix=$(jq -c . <<< "$PLATFORMS")" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c '[.[] | select(.target == "linux-x64-gnu")]' <<< "$PLATFORMS")" >> "$GITHUB_OUTPUT"
          fi

  # Compiles the managed code and the scripts; needs no PotluckDB release.
  managed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/PotluckDB.SQLitePCLRaw -c Release
      - run: python3 -m py_compile scripts/*.py test/run.py test/quickstart/run.py

  # The native library for each platform, made from its core archive.
  native:
    needs: plan
    if: needs.plan.outputs.version
    name: native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix || '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the PotluckDB library for ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D ../core \
            -p "potluckdb-sqlite-$VERSION-$TARGET.*" -p SHA256SUMS
          ls -l ../core
      - name: Build and check (glibc 2.28, in manylinux)
        if: matrix.container == 'manylinux'
        run: |
          docker run --rm -e VERSION -e TARGET -e POTLUCKDB_CORE_DIR=/src/core \
            -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/src" -w /src/dotnet "${{ matrix.image }}" \
            bash -euc 'export PATH=/opt/python/cp312-cp312/bin:$PATH; python3 scripts/native.py --target "$TARGET" --version "$VERSION"'
      - name: Build and check (musl, in Alpine)
        if: matrix.container == 'alpine'
        run: |
          docker run --rm -e VERSION -e TARGET -e POTLUCKDB_CORE_DIR=/src/core -e OWNER="$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src/dotnet "$ALPINE_BUILD_IMAGE" \
            sh -euc 'apk add -q --no-cache gcc musl-dev binutils python3 > /dev/null
              python3 scripts/native.py --target "$TARGET" --version "$VERSION"
              chown -R "$OWNER" artifacts'
      - name: Build and check
        if: ${{ !matrix.container }}
        env:
          POTLUCKDB_CORE_DIR: ${{ github.workspace }}/core
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: $PYTHON scripts/native.py --target "$TARGET" --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-native-${{ matrix.rid }}
          path: dotnet/artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error

  # Packs the packages with the native libraries of every platform built, and
  # tests them on each: PotluckDB's checks, Microsoft.Data.Sqlite's own test
  # suite and the quickstart apps (scripts/ci.sh).
  test:
    needs: [plan, native]
    if: needs.plan.outputs.version
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix || '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.container != 'alpine'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dotnet-native-*
          path: dotnet/artifacts/download
      - name: Gather the native libraries
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: $PYTHON scripts/collect.py artifacts/download
      - name: Install the system's SQLite (for the tests with two SQLite libraries)
        if: runner.os == 'Linux' && matrix.container != 'alpine'
        run: dpkg -s libsqlite3-0 > /dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-0)
      - name: Pack and test (musl, in Alpine)
        if: matrix.container == 'alpine'
        run: |
          docker run --rm -e VERSION -e TARGET -e CI -e OWNER="$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src/dotnet "$ALPINE_TEST_IMAGE" \
            sh -euc 'apk add -q --no-cache python3 sqlite-libs > /dev/null
              trap "chown -R \"\$OWNER\" /src/dotnet" EXIT
              sh scripts/ci.sh'
      - name: Pack and test
        if: matrix.container != 'alpine'
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: sh scripts/ci.sh
      - name: Run the quickstart on the oldest glibc (AlmaLinux 8, glibc 2.28)
        if: matrix.container == 'manylinux'
        run: |
          python3 test/quickstart/run.py --target "$TARGET" --publish "$RUNNER_TEMP/quickstart"
          expected="$VERSION $(jq -r .sqlite_version "artifacts/native/${{ matrix.rid }}/BUILD-INFO.json")"
          actual=$(docker run --rm -v "$RUNNER_TEMP/quickstart:/app:ro" -w /tmp "$OLDEST_GLIBC_IMAGE" /app/MdsApp)
          echo "AlmaLinux 8: $actual"
          [ "$actual" = "$expected" ] || { echo "::error::expected $expected"; exit 1; }

  publish:
    needs: [plan, test]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dotnet-native-*
          path: dotnet/artifacts/download
      - name: Make the packages, with the native library of all 8 platforms
        run: |
          python3 scripts/collect.py artifacts/download
          python3 scripts/pack.py --version "$VERSION" --all
      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sharifismail
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # The bundle first, so PotluckDB.Data.Sqlite never points at a missing one.
          for package in PotluckDB.SQLitePCLRaw PotluckDB.Data.Sqlite; do
            dotnet nuget push "artifacts/packages/$package.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
